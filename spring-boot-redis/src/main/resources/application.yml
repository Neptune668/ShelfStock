spring:
  application:
    name: spring-boot-redis
  data:
    redis:
      # 连接地址
      host: 192.168.222.99
      port: 6379
      # 无密码，留空即可
      password: 1234
      # 使用的数据库索引
      database: 0
      # 连接超时时间
      timeout: 10s
      # 连接方式：lettuce（Spring Boot 默认）
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 8
          # 连接池最大空闲连接数
          max-idle: 8
          # 连接池最小空闲连接数
          min-idle: 0
          # 获取连接的最大等待时间，-1 表示无限制
          max-wait: -1ms
