server:
  port: 8002

spring:
  application:
    name: order-service
  config:
    import:
      - nacos:order-service.yaml
  cloud:
    nacos:
      server-addr: 192.168.222.129:8848   # 注册中心地址（客户端通信端口，不是控制台的 8080）
      discovery:
        ip: 127.0.0.1
      config:
        file-extension: yaml
    openfeign:
      client:
        config:
          default: # 对所有 FeignClient 生效；也可写服务名
            connect-timeout: 2000   # 连接超时（毫秒）
            read-timeout: 3000      # 读取超时（毫秒）
      httpclient:
        enabled: true               # 用 Apache HttpClient（比默认更稳）
feign:
  sentinel:
    enabled: true               # ← 真正让 Feign 被 Sentinel 包裹的开关