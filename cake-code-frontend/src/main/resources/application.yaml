# =============================================================
# Spring Boot 全局配置文件
# 位置：src/main/resources/application.yaml
# =============================================================

spring:
  application:
    name: cake-stock
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库名对应 sql/schema.sql 中的 shelf_stock
    url: jdbc:mysql://localhost:3306/shelf_stock?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

server:
  port: 8080

# MyBatis-Plus 配置
mybatis-plus:
  # Mapper XML 位置：本项目 XML 放在 classpath 的 com/atguigu/cake/mapper 下，需显式指定
  mapper-locations: classpath:com/atguigu/cake/mapper/*.xml
  # 实体类别名包
  type-aliases-package: com.atguigu.cake.entity
  configuration:
    # 数据库下划线字段与实体驼峰属性自动映射
    map-underscore-to-camel-case: true
    # 开发阶段打印 SQL，方便排查；上线前可移除
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键自增（实体已用 @TableId(type = IdType.AUTO)，此处作全局默认）
      id-type: auto

# Knife4j / OpenAPI 接口文档
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true
  setting:
    language: zh_cn
